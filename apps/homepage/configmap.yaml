apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Homelab
    theme: dark
    headerStyle: boxed
    layout:
      Infrastructure:
        style: row
        columns: 4
      Network:
        style: row
        columns: 2
      Apps:
        style: row
        columns: 3

  services.yaml: |
    - Infrastructure:
        - TrueNAS:
            icon: truenas.png
            href: http://192.168.1.86
            siteMonitor: http://192.168.1.86
            description: NAS / bulk storage
        - K8s Control Plane:
            icon: kubernetes.png
            href: https://192.168.1.110:6443/livez
            siteMonitor: https://192.168.1.110:6443/livez
            description: kube-apiserver
        - Proxmox (prox-nix):
            icon: proxmox.png
            href: https://{{HOMEPAGE_VAR_PROXMOX_IP}}:8006
            siteMonitor: https://{{HOMEPAGE_VAR_PROXMOX_IP}}:8006
            description: Hypervisor host
        - K8s Worker:
            icon: kubernetes.png
            href: http://192.168.1.182
            siteMonitor: http://192.168.1.182
            description: Worker node

    - Network:
        - UniFi Gateway:
            icon: ubiquiti.png
            href: http://192.168.1.1
            siteMonitor: http://192.168.1.1
            description: LAN gateway
        - Xfinity Router:
            icon: xfinity.png
            href: http://10.0.0.1
            siteMonitor: http://10.0.0.1
            description: WAN / ISP router

    - Apps:
        - Ollama:
            icon: ollama.png
            href: http://{{HOMEPAGE_VAR_OLLAMA_IP}}:11434
            siteMonitor: http://{{HOMEPAGE_VAR_OLLAMA_IP}}:11434
            description: LLM inference (RTX 3090)

  bookmarks.yaml: |
    - Homelab:
        - Repo:
            - abbr: GH
              href: https://github.com/FlintSable/homelab

  widgets.yaml: |
    - datetime:
        text_size: xl
        format:
          dateStyle: full
          timeStyle: short
    - resources:
        cpu: true
        memory: true
    - search:
        provider: duckduckgo
        target: _blank

  # Empty files so Homepage does not attempt to create them on the read-only mount.
  docker.yaml: ""
  kubernetes.yaml: ""

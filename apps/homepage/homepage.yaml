apiVersion: v1
kind: Namespace
metadata:
  name: homepage

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Homelab Dashboard
    theme: dark
    color: slate
    headerStyle: boxed
    target: _blank
    layout:
      Network:
        style: row
        columns: 3
      Infrastructure:
        style: row
        columns: 3
      Services:
        style: row
        columns: 4

  services.yaml: |
    - Network:
        - UniFi:
            href: https://192.168.1.1
            icon: ubiquiti
            description: Network Controller
            ping: 192.168.1.1

        - Xfinity Router:
            href: http://10.0.0.1
            icon: router
            description: ISP Router
            ping: 10.0.0.1

    - Infrastructure:
        - TrueNAS:
            href: http://192.168.1.86
            icon: truenas
            description: Network Storage
            ping: 192.168.1.86

        - Kubernetes Control Plane:
            href: https://192.168.1.110:6443
            icon: kubernetes
            description: K8s API Server

        - Kubernetes Worker:
            href: http://192.168.1.182
            icon: kubernetes
            description: K8s Worker (GPU)
            ping: 192.168.1.182

    - Services:
        # Services will be added here as you deploy them
        # - Plex:
        #     href: http://192.168.1.202
        #     icon: plex
        #     description: Media Server
        #
        # - Grafana:
        #     href: http://192.168.1.203
        #     icon: grafana
        #     description: Metrics Dashboard

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

    - resources:
        backend: kubernetes
        expanded: true
        cpu: true
        memory: true

    - datetime:
        text_size: xl
        format:
          timeStyle: short
          dateStyle: short

  bookmarks.yaml: |
    - Developer:
        - GitHub:
            - icon: github
              href: https://github.com
              description: Code hosting

    - Documentation:
        - Kubernetes Docs:
            - icon: kubernetes
              href: https://kubernetes.io/docs
              description: K8s documentation

        - Homepage Docs:
            - icon: homepage
              href: https://gethomepage.dev
              description: Homepage documentation

  docker.yaml: ""
  kubernetes.yaml: |
    mode: cluster

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: homepage

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
      - pods
      - nodes
    verbs:
      - get
      - list
  - apiGroups:
      - extensions
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list
  - apiGroups:
      - metrics.k8s.io
    resources:
      - nodes
      - pods
    verbs:
      - get
      - list

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: homepage

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      serviceAccountName: homepage
      containers:
      - name: homepage
        image: ghcr.io/gethomepage/homepage:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /app/config
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: config
        configMap:
          name: homepage-config

---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
  labels:
    app: homepage
spec:
  type: LoadBalancer
  selector:
    app: homepage
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP

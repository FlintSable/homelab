apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v1.5.0
          ports:
            - containerPort: 3000
          env:
            # Required, or Homepage serves a blank "host not allowed" page.
            # "*" disables the check — acceptable for a private LAN dashboard.
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "*"
            # Templated unknowns — swap REPLACE_ME once collected (see spec Open Items).
            - name: HOMEPAGE_VAR_PROXMOX_IP
              value: "192.168.1.183"
            - name: HOMEPAGE_VAR_OLLAMA_IP
              value: "REPLACE_ME"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              memory: "256Mi"
          volumeMounts:
            - name: config
              mountPath: /app/config
            # Homepage writes logs here; keep it writable over the read-only config mount.
            - name: logs
              mountPath: /app/config/logs
      volumes:
        - name: config
          configMap:
            name: homepage-config
        - name: logs
          emptyDir: {}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      # The Calico pod network (192.168.0.0/16) overlaps the physical LAN
      # (192.168.1.0/24), so Calico does not SNAT pod->LAN traffic and non-node
      # LAN hosts have no return route to pod IPs. Running on the node's network
      # makes monitoring checks originate from the node's real LAN IP so every
      # main-LAN target (TrueNAS, UniFi, Proxmox, routers) is reachable.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v1.5.0
          # ICMP ping (for the bare Cluster Nodes tiles) needs raw sockets.
          securityContext:
            capabilities:
              add: ["NET_RAW"]
          ports:
            - containerPort: 3000
          env:
            # Required, or Homepage serves a blank "host not allowed" page.
            # "*" disables the check — acceptable for a private LAN dashboard.
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "*"
            # Templated unknowns — swap REPLACE_ME once collected (see spec Open Items).
            - name: HOMEPAGE_VAR_PROXMOX_IP
              value: "192.168.1.183"
            - name: HOMEPAGE_VAR_OLLAMA_IP
              value: "REPLACE_ME"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              memory: "512Mi"
          volumeMounts:
            # Mount each managed file via subPath so /app/config itself stays writable.
            # Homepage v1.5+ copies skeleton defaults (e.g. proxmox.yaml) into /app/config
            # on startup; a whole-dir read-only ConfigMap mount makes that fail with EROFS.
            - name: config
              mountPath: /app/config/settings.yaml
              subPath: settings.yaml
            - name: config
              mountPath: /app/config/services.yaml
              subPath: services.yaml
            - name: config
              mountPath: /app/config/bookmarks.yaml
              subPath: bookmarks.yaml
            - name: config
              mountPath: /app/config/widgets.yaml
              subPath: widgets.yaml
            - name: config
              mountPath: /app/config/docker.yaml
              subPath: docker.yaml
            - name: config
              mountPath: /app/config/kubernetes.yaml
              subPath: kubernetes.yaml
            - name: config
              mountPath: /app/config/custom.css
              subPath: custom.css
            - name: config
              mountPath: /app/config/custom.js
              subPath: custom.js
            - name: logs
              mountPath: /app/config/logs
      volumes:
        - name: config
          configMap:
            name: homepage-config
        - name: logs
          emptyDir: {}
